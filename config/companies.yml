# given ATS (or has no Israel jobs) is rechecked rarely, so a wrong entry costs almost nothing.
# slug: greenhouse = board token, lever = site (prefix "eu:" for the EU host),
#       ashby = job board name, comeet = "{name}/{uid}" from https://www.comeet.com/jobs/{name}/{uid}
